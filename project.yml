# project.yml – XcodeGen configuration for Kclip
# Install XcodeGen: brew install xcodegen
# Then run: xcodegen generate
# This creates Kclip.xcodeproj which you can open in Xcode and build/run.

name: Kclip
options:
  bundleIdPrefix: cc.kclip
  deploymentTarget:
    macOS: "13.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true

settings:
  base:
    PRODUCT_NAME: Kclip
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    CODE_SIGN_STYLE: Automatic
    # Change to your Apple Developer Team ID, or leave blank for local builds:
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: YES

targets:
  Kclip:
    type: application
    platform: macOS
    sources:
      - path: Sources/Kclip
        type: group
    resources:
      # Info.plist is NOT listed here: it is the bundle's Info.plist (set via
      # INFOPLIST_FILE below), not a resource to copy into Copy Bundle Resources.
      - path: Resources/Assets.xcassets
    # Single source of truth for the Info.plist is the checked-in
    # Resources/Info.plist file, referenced by INFOPLIST_FILE in settings.
    # (No `info:` block here — it would regenerate/overwrite that file on every
    # `xcodegen generate`, silently discarding manual edits.)
    entitlements:
      path: Resources/Kclip.entitlements
    settings:
      base:
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/Kclip.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: cc.kclip.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      # No external dependencies — pure system frameworks
      []

  KclipTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/KclipTests
    dependencies:
      - target: Kclip
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cc.kclip.tests
        PRODUCT_MODULE_NAME: KclipTests
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Kclip:
    build:
      targets:
        Kclip: all
        KclipTests: testing
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - KclipTests
    archive:
      config: Release
